name: Sync research targets from OneDrive

on:
  schedule:
    # 7:00 and 9:00 AM IST, Mon–Sat. Second run is a retry — GitHub schedules can fire late.
    - cron: '30 1 * * 1-6'
    - cron: '30 3 * * 1-6'
  workflow_dispatch:

concurrency:
  group: sync-research-targets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Process new and updated PDFs in batches
        run: |
          set -euo pipefail
          URL="https://stockscreenerlatest.vercel.app/api/research-targets/sync"
          for i in $(seq 1 60); do
            code=$(curl -sS -o resp.json -w '%{http_code}' -X POST --max-time 90 "$URL")
            if [ "$code" != "200" ]; then
              echo "::error::Sync failed (HTTP $code): $(head -c 400 resp.json)"
              exit 1
            fi
            synced=$(jq '.synced' resp.json)
            remaining=$(jq '.remaining' resp.json)
            errors=$(jq '.errors' resp.json)
            echo "Batch $i: synced=$synced errors=$errors remaining=$remaining"
            jq -r '.results[] | select(startswith("skip") | not)' resp.json || true
            if [ "$remaining" = "0" ] || [ "$synced" = "0" ]; then break; fi
          done
          echo "Done — $(jq '.total' resp.json) stocks have PDF-sourced targets."
